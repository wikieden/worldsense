[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spatialmem-perception"
version = "0.1.0a0"
description = "Perception adapters for SpatialMem — turn RGB(-D) frames into world-frame Detections. Companion to the numpy-only spatialmem memory core."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "wikieden" }]
dependencies = ["spatialmem", "numpy"]

[project.optional-dependencies]
clip = ["open-clip-torch", "torch", "pillow"]
dev = ["pytest", "pytest-cov", "ruff", "pyright"]

[project.urls]
Core = "https://github.com/wikieden/spatialmem"

[tool.hatch.build.targets.wheel]
packages = ["src/spatialmem_perception"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "PERF", "RUF"]

[tool.pyright]
include = ["src/spatialmem_perception"]
pythonVersion = "3.10"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
